[project]
name = "extraction"
version = "0.1.0"
description = "Track B extraction engine: rule/ML/LLM/hybrid approaches benchmarked against ground truth"
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "pandas",
    "pydantic",
    "scikit-learn",
    "openai",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
